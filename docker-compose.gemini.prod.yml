services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gemini
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - AI_BACKEND=gemini
      - CODE_EXECUTOR=piston
      - PISTON_URL=http://piston:2000
      - ALLOWED_ORIGINS=${DOMAIN:?Set DOMAIN env var, e.g. https://yourdomain.com}
      - VLLM_AUTOSTART=false
    depends_on:
      piston:
        condition: service_started
      piston-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${DOMAIN:?Set DOMAIN env var, e.g. https://yourdomain.com}
        - NEXT_PUBLIC_WS_URL=${DOMAIN_WS:?Set DOMAIN_WS env var, e.g. wss://yourdomain.com}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    ports:
      - "2000:2000"
    environment:
      - PISTON_RUN_TIMEOUT=15000
      - PISTON_COMPILE_TIMEOUT=30000
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    restart: always

  piston-init:
    image: curlimages/curl:latest
    depends_on:
      - piston
    environment:
      - PISTON_PACKAGES=python:3.12.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "piston-init: waiting for Piston API..."
        until curl -sf http://piston:2000/api/v2/runtimes >/dev/null; do sleep 1; done
        installed=$$(curl -s http://piston:2000/api/v2/runtimes)
        for pkg in $$PISTON_PACKAGES; do
          lang=$${pkg%:*}; ver=$${pkg#*:}
          if echo "$$installed" | grep -q "\"language\":\"$$lang\""; then
            echo "piston-init: $$lang already installed, skipping."
            continue
          fi
          echo "piston-init: installing $$lang $$ver ..."
          curl -sf -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d "{\"language\":\"$$lang\",\"version\":\"$$ver\"}"
          echo
        done
        echo "piston-init: done."
    restart: "no"

volumes:
  piston-packages:
