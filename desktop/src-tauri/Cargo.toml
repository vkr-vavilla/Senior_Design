[package]
name = "finalround-desktop"
version = "0.1.2"
edition = "2021"
description = "FinalRound desktop shell"
authors = ["FinalRound"]
license = "MIT"

# The library the desktop binary links against (Tauri v2 layout).
[lib]
name = "finalround_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux only, and only to turn the microphone on — see webview.rs. WebKitGTK
# ships with media capture disabled and denies permission requests it isn't
# asked about, so getUserMedia fails in the packaged app even though it works
# in a browser on the same machine.
#
# Pinned to the exact version wry depends on ("=2.0.2"): a different version
# would be a *different crate instance*, and the WebView handle Tauri hands us
# would not be the type these traits are implemented for.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
