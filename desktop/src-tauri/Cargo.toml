[package]
name = "prepai-desktop"
version = "0.1.1"
edition = "2021"
description = "PrepAI desktop shell"
authors = ["PrepAI"]
license = "MIT"

# The library the desktop binary links against (Tauri v2 layout).
[lib]
name = "prepai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
