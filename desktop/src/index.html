<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepAI</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 55%, #020617 100%);
        color: #e2e8f0;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        text-align: center;
        padding: 2rem;
      }
      .logo {
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tagline { color: #94a3b8; font-size: 0.95rem; }
      .bar {
        width: min(420px, 80vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        transition: width 0.4s ease;
      }
      .status { font-size: 0.9rem; color: #cbd5e1; min-height: 1.2em; }
      .error {
        max-width: 460px;
        color: #fca5a5;
        font-size: 0.85rem;
        line-height: 1.5;
        display: none;
        white-space: pre-wrap;
      }
      .retry {
        display: none;
        margin-top: 0.5rem;
        padding: 0.55rem 1.4rem;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .retry:hover { background: #334155; }
      .row { display: flex; gap: 0.75rem; }
      /* The install button is the primary action when a prerequisite is missing. */
      #install {
        border-color: #6366f1;
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
      }
      #install:hover { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
      /* An amber note (e.g. "restart PrepAI") rather than a red failure. */
      .error.notice { color: #fcd34d; }
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid rgba(148,163,184,0.3);
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">PrepAI</div>
      <div class="tagline">Starting your local interview environment…</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">Preparing…</div>
      <div class="error" id="error"></div>
      <div class="row">
        <button class="retry" id="install"></button>
        <button class="retry" id="retry">Retry</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
