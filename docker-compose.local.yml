# ── FinalRound local package: fully self-contained stack ─────────────────────────
# Everything runs on this machine: MongoDB is bundled (no Atlas account),
# speech-to-text is local faster-whisper (no Groq key), text-to-speech is local
# Kokoro (no Google credentials).
# The only optional cloud dependency is Gemini, for machines without a GPU.
#
# First run (recommended):   ./setup_local.sh
# By hand:
#   docker compose -f docker-compose.local.yml --profile gpu up -d          # NVIDIA GPU: local Qwen
#   AI_BACKEND=gemini docker compose -f docker-compose.local.yml up -d      # no GPU: Gemini key

# Own project name: keeps the package's containers/volumes separate from a dev
# stack started from docker-compose.yml in this same directory.
name: prepai-local

services:
  # ── MongoDB: bundled database (replaces Atlas for the local package) ────────
  # No host port: only the backend talks to it, over the compose network. (A
  # mapping would collide with any MongoDB already installed on the machine.
  # To inspect: docker compose -f docker-compose.local.yml exec mongo mongosh)
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env             # generated by setup_local.sh (JWT secret etc.)
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=FinalRound
      # Personal machine: keep users logged in for 90 days instead of the hosted
      # default of 7, so opening the app drops them straight onto their history.
      - ACCESS_TOKEN_EXPIRE_MINUTES=129600
      # AI_BACKEND=qwen   -> local model via the vllm service (needs --profile gpu)
      # AI_BACKEND=gemini -> Gemini cloud API (user-supplied key)
      - AI_BACKEND=${AI_BACKEND:-qwen}
      - VLLM_AUTOSTART=false
      # Parametrized so the same backend points at either engine (set by
      # setup_local.sh via detect_engine.sh): vLLM (--profile gpu) or Ollama
      # (--profile ollama). Defaults keep the original vLLM behavior.
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8001/v1}
      - VLLM_MODEL=${VLLM_MODEL:-interviewer}
      - VLLM_BASE_MODEL=${VLLM_BASE_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CODE_EXECUTOR=piston
      - PISTON_URL=http://piston:2000
      - REDIS_URL=redis://redis:6379/0
      # Fully local speech-to-text — no API key. WHISPER_MODEL: tiny/base/small/medium.
      - STT_BACKEND=local
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      # Fully local voice — Kokoro-82M on CPU, no Google credentials. The ~353 MB
      # of weights download on first boot into the bind-mounted backend/kokoro_models
      # (see the volumes below), so a rebuild doesn't re-fetch them. Until they
      # land, the frontend falls back to the browser's own speech synthesis.
      # Set TTS_BACKEND=google + GOOGLE_APPLICATION_CREDENTIALS to use Cloud TTS.
      - TTS_BACKEND=${TTS_BACKEND:-kokoro}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      # Whisper weights land in the HF cache; persist them across rebuilds.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      mongo:
        condition: service_started
      piston:
        condition: service_started
      piston-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  vllm:
    image: vllm/vllm-openai:v0.7.3
    # Local-model server, only with an NVIDIA GPU: --profile gpu
    profiles: ["gpu"]
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --quantization
      - awq_marlin
      - --dtype
      - half
      - --port
      - "8001"
      - --max-model-len
      - "24576"
      - --gpu-memory-utilization
      - "0.90"
      - --enforce-eager
      # Reuse the KV cache for the long, per-interview system prompt (resume + JD +
      # persona) that repeats on every turn — cuts prefill cost/latency each turn.
      - --enable-prefix-caching
      - --max-num-seqs
      - "32"
      - --enable-lora
      - --max-lora-rank
      - "64"
      - --lora-modules
      # Defaults to the published adapter on the Hub so a fresh clone gets the
      # fine-tuned interviewer instead of silently serving the plain base model.
      # setup_local.sh overrides this with the /adapters path on machines that
      # already have the adapter on disk (i.e. the training box), so those keep
      # loading locally with no download and no network dependency.
      - interviewer=${INTERVIEWER_ADAPTER:-FinalRound/prepai-interviewer}
    environment:
      # Offline by default only when the adapter is local; a Hub-sourced adapter
      # obviously needs one online fetch, after which hf-cache serves it. Set
      # HF_HUB_OFFLINE=1 in backend/.env to force fully-offline once cached.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    ports:
      - "8001:8001"
    volumes:
      # Named volume (not the host ~/.cache) so the ~5.5 GB weights download once
      # and survive rebuilds on any OS, including Docker Desktop on Windows/macOS.
      - hf-cache:/root/.cache/huggingface
      - ./training/artifacts:/adapters:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Ollama: cross-platform local inference (Mac/AMD/CPU/Windows) ────────────
  # Serves the same OpenAI-compatible /v1 API as vLLM, so the backend is
  # unchanged — only VLLM_BASE_URL differs. Enabled with: --profile ollama.
  # Requires the GGUF artifacts in ./ollama/models (produced once by
  # scripts/build_gguf.sh with CREATE_OLLAMA=0).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      # Modelfiles + models/*.gguf; relative FROM/ADAPTER paths resolve here.
      - ./ollama:/modelfiles:ro
    restart: always

  # One-shot: register the two models (base for grading, interviewer=base+LoRA)
  # from the mounted Modelfiles. Idempotent — skips tags that already exist.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "ollama-init: waiting for Ollama API..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        if ollama list | grep -q '^qwen2.5-7b-instruct'; then
          echo "ollama-init: base already present, skipping."
        else
          echo "ollama-init: creating base model (grading)..."
          ollama create qwen2.5-7b-instruct -f /modelfiles/Modelfile.base
        fi
        if ollama list | grep -q '^interviewer'; then
          echo "ollama-init: interviewer already present, skipping."
        else
          echo "ollama-init: creating interviewer model (base + LoRA)..."
          ollama create interviewer -f /modelfiles/Modelfile.interviewer
        fi
        echo "ollama-init: done."
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    # The image's default CMD is `npm run dev` (dev server with per-route
    # on-demand compilation), which makes every page feel slow. This package is
    # an end-user install, not a dev checkout, so serve a production build
    # instead. The build re-runs on container start, which both picks up a
    # `git pull` and is why the desktop splash shows a "building" phase.
    # ensure-deps first: node_modules lives in an anonymous volume that
    # outlives container recreation, so after an update it can be older than
    # the code bind-mounted over it. See frontend/scripts/ensure-deps.mjs.
    command: sh -c "node scripts/ensure-deps.mjs && npm run build && npm run start"
    environment:
      # NEXT_PUBLIC vars are browser-side, so they use the host machine's address
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      # local => on-device engine offered; set to 'cloud' on the hosted site,
      # where Gemini (user's own key) is the only option.
      - NEXT_PUBLIC_DEPLOYMENT=${NEXT_PUBLIC_DEPLOYMENT:-local}
      - CI=true
      # Monaco Editor compilation is heavy in dev mode — give Node.js enough heap
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # ── Piston: self-hosted code-execution sandbox (same as docker-compose.yml) ──
  piston:
    image: ghcr.io/engineer-man/piston:latest
    platform: linux/amd64
    privileged: true
    ports:
      - "2000:2000"
    environment:
      # Raise the per-request caps (defaults are 3000ms run / 10000ms compile) so
      # they accommodate the grader's wall_time_limit (10s).
      - PISTON_RUN_TIMEOUT=15000
      - PISTON_COMPILE_TIMEOUT=30000
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    restart: always

  # One-shot: install the Python runtime into Piston on first boot (idempotent).
  piston-init:
    image: curlimages/curl:latest
    depends_on:
      - piston
    environment:
      - PISTON_PACKAGES=python:3.12.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "piston-init: waiting for Piston API..."
        until curl -sf http://piston:2000/api/v2/runtimes >/dev/null; do sleep 1; done
        installed=$$(curl -s http://piston:2000/api/v2/runtimes)
        for pkg in $$PISTON_PACKAGES; do
          lang=$${pkg%:*}; ver=$${pkg#*:}
          if echo "$$installed" | grep -q "\"language\":\"$$lang\""; then
            echo "piston-init: $$lang already installed, skipping."
            continue
          fi
          echo "piston-init: installing $$lang $$ver ..."
          curl -sf -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d "{\"language\":\"$$lang\",\"version\":\"$$ver\"}"
          echo
        done
        echo "piston-init: done."
    restart: "no"

  # ── Redis: per-turn crash-safety snapshot of the live interview ─────────────
  # No host port (backend-only, compose network) — avoids colliding with a Redis
  # already installed on the machine.
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    restart: always

volumes:
  mongo-data:
  piston-packages:
  redis-data:
  hf-cache:
  ollama-data:
