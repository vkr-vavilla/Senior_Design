services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # Override the .env: pick backend without rebuilding the image.
      # AI_BACKEND=gemini   -> use Gemini cloud API
      # AI_BACKEND=qwen     -> use the vllm service below
      - AI_BACKEND=${AI_BACKEND:-gemini}
      - VLLM_AUTOSTART=false
      - VLLM_BASE_URL=http://vllm:8001/v1
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Code execution: "piston" (sandboxed, default) or "local" (subprocess,
      # no isolation — trusted/demo only).
      - CODE_EXECUTOR=${CODE_EXECUTOR:-piston}
      # Piston code-execution sandbox, reachable on the compose network
      - PISTON_URL=http://piston:2000
      # Redis: per-turn crash-safety snapshot of the live interview (best-effort)
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    # Note: vllm is intentionally NOT in depends_on. It lives behind the "gpu"
    # profile, so on a Gemini/AWS box it simply isn't started, and the backend
    # reaches it lazily over the network only when AI_BACKEND=qwen.
    # piston IS a dependency: it's the code-execution sandbox used in every
    # deployment (CODE_EXECUTOR=piston), so it should always come up with backend.
    depends_on:
      piston:
        condition: service_started
      # Wait until the runtime(s) are actually installed, so the first coding
      # submission after `up` doesn't hit an empty Piston.
      piston-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  vllm:
    image: vllm/vllm-openai:v0.7.3
    # Local-model server only. Starts ONLY when the "gpu" profile is active:
    #   GPU box:    docker compose --profile gpu up -d   (AI_BACKEND defaults to qwen)
    #   Gemini box: docker compose up -d                 (no profile → vllm skipped)
    profiles: ["gpu"]
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct-AWQ
      - --quantization
      - awq_marlin
      - --dtype
      - half
      - --port
      - "8001"
      - --max-model-len
      - "24576"
      - --gpu-memory-utilization
      - "0.90"
      - --enforce-eager
      # Reuse the KV cache for the long, per-interview system prompt (resume + JD +
      # persona) that repeats on every turn — cuts prefill cost/latency each turn.
      - --enable-prefix-caching
      - --max-num-seqs
      - "32"
      - --enable-lora
      - --max-lora-rank
      - "64"
      - --lora-modules
      - interviewer=/adapters/qwen2.5-7b-chatml-qlora-v2
    environment:
      # Model + adapter are already on disk (mounted below) — skip the Hub
      # file-listing call vLLM makes on startup, which otherwise hard-fails
      # on machines with no internet access instead of just using the cache.
      - HF_HUB_OFFLINE=1
    ports:
      - "8001:8001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./training/artifacts:/adapters:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      # NEXT_PUBLIC vars are browser-side, so they use the host machine's address
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - CI=true
      # Monaco Editor compilation is heavy in dev mode — give Node.js enough heap
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # ── Piston: self-hosted multi-language sandbox ──────────────────────────────
  # The code-execution backend (CODE_EXECUTOR=piston). No API key, runs offline.
  # Real isolation (cgroup + namespace) unlike CODE_EXECUTOR=local, and runs on
  # a stock cgroup v2 host with no kernel changes. Always on (backend depends on it).
  #   # one-time, install the language(s) you want — e.g. Python:
  #   curl -s -X POST localhost:2000/api/v2/packages \
  #        -H 'Content-Type: application/json' \
  #        -d '{"language":"python","version":"3.12.0"}'
  # NOTE: coding/driver.py is Python-only, so only Python submissions GRADE
  #       today; other languages execute but need a per-language driver first.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    platform: linux/amd64
    privileged: true
    ports:
      - "2000:2000"
    environment:
      # Raise the per-request caps (defaults are 3000ms run / 10000ms compile) so
      # they accommodate the grader's wall_time_limit (10s). Requests may not
      # exceed these, so they must be >= what piston_client sends.
      - PISTON_RUN_TIMEOUT=15000
      - PISTON_COMPILE_TIMEOUT=30000
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    restart: always

  # ── Piston bootstrap: install language runtimes automatically ───────────────
  # Piston keeps installed packages in the `piston-packages` named volume, which
  # is NOT part of the image — so a fresh machine (empty volume) starts with zero
  # runtimes and coding submissions fail. This one-shot service waits for Piston,
  # installs the language(s) we need (idempotent: skips anything already present),
  # then exits. backend depends_on it with service_completed_successfully, so the
  # stack is never "up" before Python is runnable. Add more PISTON_PACKAGES to
  # provision additional languages (space-separated "language:version" pairs).
  piston-init:
    image: curlimages/curl:latest
    depends_on:
      - piston
    environment:
      - PISTON_PACKAGES=python:3.12.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "piston-init: waiting for Piston API..."
        until curl -sf http://piston:2000/api/v2/runtimes >/dev/null; do sleep 1; done
        installed=$$(curl -s http://piston:2000/api/v2/runtimes)
        for pkg in $$PISTON_PACKAGES; do
          lang=$${pkg%:*}; ver=$${pkg#*:}
          if echo "$$installed" | grep -q "\"language\":\"$$lang\""; then
            echo "piston-init: $$lang already installed, skipping."
            continue
          fi
          echo "piston-init: installing $$lang $$ver ..."
          curl -sf -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d "{\"language\":\"$$lang\",\"version\":\"$$ver\"}"
          echo
        done
        echo "piston-init: done."
    restart: "no"

  # ── Redis: per-turn crash-safety snapshot of the live interview ─────────────
  # chat_ws writes the running transcript to Redis every turn (best-effort). If
  # the backend crashes mid-interview, the state survives and is restored when the
  # client reconnects. MongoDB is still the source of truth (flushed on disconnect).
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  piston-packages:
  redis-data:
